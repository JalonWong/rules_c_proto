name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-${{ github.workflow }}
          repository-cache: true
      - name: env
        run: bazel --version
      - name: Test on Windows
        if: matrix.os == 'windows-latest'
        run: bazel test --config=windows //test:tests
      - name: Test
        if: matrix.os != 'windows-latest'
        run: bazel test --config=osx //test:tests
